name: manifest

on:
  schedule:
    # section 10's ~15 minute release-detection cadence
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "catalog/**"
      - ".github/workflows/manifest.yml"

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Generate manifest
        env:
          GH_TOKEN: ${{ github.token }}
          # needed to read the ReVanced-style apps' releases on the shared private artifacts repo
          # (a different repo than this workflow runs in, so the ambient GH_TOKEN above can't see
          # it on its own) - see SETUP.md section 5
          ARTIFACTS_REPO_TOKEN: ${{ secrets.ARTIFACTS_REPO_TOKEN }}
        run: python3 catalog/scripts/generate_manifest.py

      - name: Check for changes
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Skip signing/publishing when nothing actually changed - the schedule trigger fires
          # every ~15 minutes (section 10) regardless of whether any tracked app released
          # something new, so most runs should be a no-op rather than a fresh sign+publish.
          if gh release download manifest-latest -p manifest.json -O manifest.json.previous --clobber 2>/dev/null; then
            if diff -q manifest.json manifest.json.previous >/dev/null 2>&1; then
              echo "changed=false" >> "$GITHUB_OUTPUT"
              echo "Manifest is unchanged since the last publish, skipping sign/publish."
            else
              echo "changed=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "No previous manifest-latest release found, publishing for the first time."
          fi

      - name: Sign manifest
        if: steps.check.outputs.changed == 'true'
        env:
          MANIFEST_SIGNING_KEY: ${{ secrets.MANIFEST_SIGNING_KEY }}
        run: |
          if [ -z "$MANIFEST_SIGNING_KEY" ]; then
            echo "MANIFEST_SIGNING_KEY secret is not set yet, see SETUP.md section 3." >&2
            exit 1
          fi
          umask 077
          printf '%s\n' "$MANIFEST_SIGNING_KEY" > /tmp/manifest-signing-key.pem
          openssl pkeyutl -sign -inkey /tmp/manifest-signing-key.pem -rawin -in manifest.json -out manifest.json.sig
          rm -f /tmp/manifest-signing-key.pem

      - name: Publish manifest release
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view manifest-latest >/dev/null 2>&1; then
            gh release upload manifest-latest manifest.json manifest.json.sig --clobber
          else
            gh release create manifest-latest manifest.json manifest.json.sig \
              --title "Catalog manifest" \
              --notes "Auto-generated by .github/workflows/manifest.yml, do not edit manually."
          fi
